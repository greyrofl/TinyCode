<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Card</title>
    <style>
        body {
            background-color: #ff4d4d;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #ff1a1a;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
            text-align: center;
        }
        .card h2 {
            margin-bottom: 10px;
        }
        .card p {
            margin: 5px 0;
        }
        .card a {
            color: #fff;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>John Doe</h2>
        <p><strong>Senior Developer</strong></p>
        <p>Email: john.doe@example.com</p>
        <p>Github: <a href="https://github.com/johndoe">@johndoe</a></p>
    </div>
</body>
</html>
